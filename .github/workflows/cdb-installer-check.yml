name: Verify CDB installer source and official download
on:
  push:
    branches: [main]
    paths: ['tools/cdb-installer/**', '.github/workflows/cdb-installer-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - shell: powershell
        run: ./tools/cdb-installer/Test-Installer.ps1
