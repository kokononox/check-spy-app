name: Owned read-only memory snapshot validation
on:
  push:
    paths:
      - 'tools/readonly-code-validation/**'
      - '.github/workflows/readonly-code-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-fixture:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic snapshot scope and budgets
        shell: ${{ matrix.shell }}
        run: |
          & .\tools\readonly-code-validation\tests\Test-Core.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native read of owned fixture and guard refusal
        shell: ${{ matrix.shell }}
        run: |
          & .\tools\readonly-code-validation\tests\Test-Native-Windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
